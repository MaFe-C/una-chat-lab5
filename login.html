<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | UNA Chat</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf6f0; color: #17372c; font: 16px system-ui, sans-serif; }
    main { width: min(420px, calc(100% - 2rem)); padding: 2rem; background: white; border: 1px solid #d3e4d9; border-radius: 1rem; box-shadow: 0 18px 45px #0b3d2e17; }
    h1 { margin: 0 0 .5rem; }
    p { line-height: 1.5; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.1rem; border-radius: .5rem; background: #0b6b4c; color: white; text-decoration: none; font-weight: 600; }
    #notice { color: #9a3412; min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>UNA Chat</h1>
    <p>Inicie sesión con su cuenta social para acceder al chat.</p>
    <p id="notice" role="alert"></p>
    <a href="/login">Iniciar sesión</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const notice = document.getElementById('notice');
    if (params.get('auth_error') === 'cancelled') notice.textContent = 'Se canceló el inicio de sesión. Puede intentarlo de nuevo.';
    else if (params.has('auth_error')) notice.textContent = 'No se pudo iniciar sesión. Inténtelo de nuevo.';
    else if (params.has('login_required')) notice.textContent = 'Debe iniciar sesión para entrar al chat.';
  </script>
</body>
</html>
